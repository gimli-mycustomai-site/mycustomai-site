<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- No analytics on this page: the invite token is in the URL -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Leave a Review — My Custom AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20" />
</head>
<body>

<!-- ── Nav ───────────────────────────────────────────────── -->
<nav class="nav">
  <div class="container nav-inner">
    <a href="/" class="nav-logo" style="text-decoration:none;">My<span>Custom</span>AI</a>
  </div>
</nav>

<!-- ── Leave a Review (invite only) ──────────────────────── -->
<section class="section" id="leave-review" style="min-height:70vh;">
  <div class="container" style="max-width:620px;text-align:center;">
    <div class="section-label">Client Reviews</div>
    <h2 style="font-size:clamp(1.4rem,3.5vw,2rem);margin-bottom:12px;">Worked with Nainoa?</h2>

    <p id="rStatus" style="color:#94a3b8;margin-bottom:32px;font-size:1rem;">Checking your review link… this can take up to a minute.</p>

    <form id="testimonialForm" style="text-align:left;display:none;">
      <div style="display:grid;gap:16px;">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div>
            <label for="tName" style="display:block;font-size:0.85rem;color:#94a3b8;margin-bottom:6px;">Your Name *</label>
            <input type="text" id="tName" required maxlength="80" placeholder="Jane Smith"
              style="width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f1f5f9;font-size:0.95rem;box-sizing:border-box;" />
          </div>
          <div>
            <label for="tCompany" style="display:block;font-size:0.85rem;color:#94a3b8;margin-bottom:6px;">Company</label>
            <input type="text" id="tCompany" maxlength="100" placeholder="Acme Inc."
              style="width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f1f5f9;font-size:0.95rem;box-sizing:border-box;" />
          </div>
        </div>

        <div>
          <label for="tTitle" style="display:block;font-size:0.85rem;color:#94a3b8;margin-bottom:6px;">Your Role</label>
          <input type="text" id="tTitle" maxlength="100" placeholder="CEO / Operations Manager / Consultant"
            style="width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f1f5f9;font-size:0.95rem;box-sizing:border-box;" />
        </div>

        <div>
          <label for="tTestimonial" style="display:block;font-size:0.85rem;color:#94a3b8;margin-bottom:6px;">Your Review *</label>
          <textarea id="tTestimonial" required minlength="20" maxlength="2000" rows="5" placeholder="What changed after working with Nainoa?"
            style="width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f1f5f9;font-size:0.95rem;box-sizing:border-box;resize:vertical;"></textarea>
        </div>

        <div>
          <label style="display:block;font-size:0.85rem;color:#94a3b8;margin-bottom:10px;">Star Rating *</label>
          <div id="starRating" style="display:flex;gap:8px;">
            <span class="star" data-val="1" style="font-size:1.8rem;cursor:pointer;color:#334155;">★</span>
            <span class="star" data-val="2" style="font-size:1.8rem;cursor:pointer;color:#334155;">★</span>
            <span class="star" data-val="3" style="font-size:1.8rem;cursor:pointer;color:#334155;">★</span>
            <span class="star" data-val="4" style="font-size:1.8rem;cursor:pointer;color:#334155;">★</span>
            <span class="star" data-val="5" style="font-size:1.8rem;cursor:pointer;color:#334155;">★</span>
          </div>
          <input type="hidden" id="tRating" value="0" />
        </div>

        <div style="display:flex;align-items:flex-start;gap:10px;">
          <input type="checkbox" id="tPermission" required style="margin-top:3px;accent-color:#6366f1;" />
          <label for="tPermission" style="font-size:0.9rem;color:#94a3b8;line-height:1.5;">
            I give permission to publish this review on mycustomai.co *
          </label>
        </div>

        <p style="font-size:0.8rem;color:#64748b;line-height:1.5;margin-top:-8px;">Your review is published as written, whatever the rating. This link works once.</p>

        <div id="tMsg" style="display:none;padding:12px 16px;border-radius:8px;font-size:0.95rem;"></div>

        <button type="submit" id="tBtn" class="btn btn-primary" style="width:100%;justify-content:center;">
          Submit Review
        </button>
      </div>
    </form>
  </div>
</section>

<script>
(function() {
  var API = 'https://mycustomai-backend-1.onrender.com';

  // Read the token, then remove it from the address bar
  var token = new URLSearchParams(window.location.search).get('t') || '';
  if (window.history && history.replaceState) history.replaceState(null, '', window.location.pathname);

  var statusEl = document.getElementById('rStatus');
  var form     = document.getElementById('testimonialForm');
  var btn      = document.getElementById('tBtn');
  var msg      = document.getElementById('tMsg');

  var REASONS = {
    invalid:  'This review link is not valid. Please check you copied the full link, or contact us via the Support page.',
    expired:  'This review link has expired. Please ask Nainoa for a new one.',
    used:     'This review link has already been used. Thank you for your review!',
    rate_limited: 'Too many attempts. Please try again in 15 minutes.',
    server_not_configured: 'Reviews are temporarily unavailable. Please try again later.',
    server_error: 'Something went wrong checking your link. Please refresh to try again.'
  };

  function showMsg(text, ok) {
    msg.style.display = 'block';
    msg.style.background = ok ? 'rgba(34,197,94,0.1)' : 'rgba(239,68,68,0.1)';
    msg.style.color = ok ? '#22c55e' : '#ef4444';
    msg.textContent = text;
  }

  // ── Stars ──
  var stars = document.querySelectorAll('.star');
  var ratingInput = document.getElementById('tRating');
  function setStars(val) {
    stars.forEach(function(s) {
      s.style.color = parseInt(s.dataset.val, 10) <= val ? '#f59e0b' : '#334155';
    });
  }
  stars.forEach(function(s) {
    s.addEventListener('click', function() {
      ratingInput.value = s.dataset.val;
      setStars(parseInt(s.dataset.val, 10));
    });
    s.addEventListener('mouseover', function() { setStars(parseInt(s.dataset.val, 10)); });
  });
  document.getElementById('starRating').addEventListener('mouseleave', function() {
    setStars(parseInt(ratingInput.value, 10));
  });

  // ── Check the link ──
  if (!token) {
    statusEl.textContent = 'Reviews are by invitation. If you worked with Nainoa and would like to leave one, please ask for your review link.';
    return;
  }

  fetch(API + '/api/review-invite/check?t=' + encodeURIComponent(token))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.valid) {
        statusEl.textContent = 'Thanks for taking a minute — honest feedback helps other businesses find the right help.';
        form.style.display = 'block';
      } else {
        statusEl.textContent = REASONS[data.reason] || REASONS.invalid;
      }
    })
    .catch(function() {
      statusEl.textContent = REASONS.server_error;
    });

  // ── Submit ──
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var name = document.getElementById('tName').value.trim();
    var testimonial = document.getElementById('tTestimonial').value.trim();
    var rating = parseInt(ratingInput.value, 10);

    if (!name || testimonial.length < 20) {
      showMsg('Please add your name and at least a sentence or two (20+ characters).', false);
      return;
    }
    if (!(rating >= 1 && rating <= 5)) {
      showMsg('Please choose a star rating.', false);
      return;
    }
    if (!document.getElementById('tPermission').checked) {
      showMsg('Please confirm permission to publish.', false);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    fetch(API + '/api/testimonial', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        name: name,
        company: document.getElementById('tCompany').value.trim(),
        title: document.getElementById('tTitle').value.trim(),
        testimonial: testimonial,
        rating: rating,
        permission: 'yes'
      })
    })
    .then(function(r) {
      return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data }; });
    })
    .then(function(res) {
      if (res.ok) {
        form.style.display = 'none';
        statusEl.textContent = res.data.message || 'Thank you! Your review has been published.';
        return;
      }
      showMsg(res.data.error || 'Something went wrong. Please try again.', false);
      if (res.status === 401 || res.status === 409) {
        btn.textContent = 'Link no longer valid';
      } else {
        btn.disabled = false;
        btn.textContent = 'Submit Review';
      }
    })
    .catch(function() {
      showMsg('Something went wrong. Please try again.', false);
      btn.disabled = false;
      btn.textContent = 'Submit Review';
    });
  });
})();
</script>

</body>
</html>
