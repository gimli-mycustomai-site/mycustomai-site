<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchase Confirmed — My Custom AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --accent: #3b82f6;
      --bg: #0b0f1e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --card-bg: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    .confirmation-wrap { max-width: 900px; margin: 0 auto; padding: 60px 24px; }
    .confirmation-header { text-align: center; margin-bottom: 48px; }
    .check-icon { font-size: 4rem; color: var(--primary); margin-bottom: 16px; }
    .confirmation-header h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin-bottom: 12px; }
    .confirmation-header p { font-size: 1.1rem; color: var(--muted); }
    
    .booking-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
    }
    .booking-card h2 { font-size: 1.5rem; margin-bottom: 16px; color: var(--primary); }
    .booking-card p { font-size: 1rem; line-height: 1.6; color: var(--muted); margin-bottom: 24px; }
    
    .cal-embed { min-width: 100%; height: 650px; }
    
    .help-section { text-align: center; padding: 32px; background: var(--card-bg); border-radius: 12px; }
    .help-section h3 { margin-bottom: 12px; }
    .help-section a { color: var(--primary); text-decoration: none; }
    .help-section a:hover { color: var(--primary-hover); }
  </style>
</head>
<body>
  <div class="confirmation-wrap">
    <div class="confirmation-header">
      <div class="check-icon">✓</div>
      <h1>Payment Confirmed!</h1>
      <p>Your purchase was successful. Now let's schedule your sessions.</p>
    </div>

    <div class="booking-card">
      <h2 id="tierTitle">Loading...</h2>
      <p id="tierInstructions"></p>
      <div class="cal-embed" id="calEmbed"></div>
    </div>

    <div class="help-section">
      <h3>Questions?</h3>
      <p>Email us at <a href="mailto:hello@mycustomai.co">hello@mycustomai.co</a> or <a href="audit.html">request a free audit</a>.</p>
    </div>
  </div>

  <!-- Official Cal.com embed loader. Defines the window.Cal queue stub and loads
       embed.js itself. embed.js must NOT be loaded as a plain script src tag — it
       expects this stub to already exist and throws "Cal is not defined" without it. -->
  <script type="text/javascript">
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
  </script>
  <script>
    // Parse tier from URL
    const params = new URLSearchParams(window.location.search);
    const tier = params.get('tier');
    
    // Keys are the ?tier= values sent by the existing Stripe redirect URLs — those
    // stay as-is. Only the displayed tier numbering changed when the entry tier
    // was removed:
    //   ?tier=2 → Tier 1 (Guided Sprint and Training)
    //   ?tier=3 → Tier 2 (Intensive Advisory)
    const tierConfig = {
      '2': {
        title: 'Tier 1 — Guided Sprint and Training',
        instructions: 'Your program runs 5 weeks. Book your first session below — you\'ll schedule the rest as we progress through your sprint.',
        calSlug: 'tier-2-guided-sprint'
      },
      '3': {
        title: 'Tier 2 — Intensive Advisory',
        instructions: 'Your program runs 8 weeks of intensive advisory sessions. Book your first session below — we\'ll coordinate the full schedule together as we go.',
        calSlug: 'tier-3-intensive-advisory'
      },
      // Monthly retainers. These require the matching Stripe payment link to redirect to
      // confirmation.html?tier=momentum / ?tier=steady-progress / ?tier=embedded-coach
      // (set under Payment Links → After payment in the Stripe dashboard).
      'momentum': {
        title: 'Momentum Retainer',
        instructions: 'Your retainer includes one 60-minute training call per month plus light email support between sessions. Book this month\'s call below.',
        calSlug: 'momentum-retainer'
      },
      'steady-progress': {
        title: 'Steady Progress Retainer',
        instructions: 'Your retainer includes two 60-minute training calls per month plus email support between sessions. Book your first call below — schedule the second whenever you need it.',
        calSlug: 'steady-progress-retainer'
      },
      'embedded-coach': {
        title: 'Embedded Coach Retainer',
        instructions: 'Your retainer includes one 90-minute team training session per month plus priority email support between sessions. Book this month\'s session below.',
        calSlug: 'embedded-coach-retainer'
      }
    };
    
    const config = tierConfig[tier] || tierConfig['2'];
    
    document.getElementById('tierTitle').textContent = config.title;
    document.getElementById('tierInstructions').textContent = config.instructions;
    
    // Embed Cal.com inline. data-cal-link + Cal('init') is the popup-on-click pattern
    // and only attaches a click handler — an inline calendar needs Cal('inline', ...).
    Cal('init', { origin: 'https://cal.com' });
    Cal('inline', {
      elementOrSelector: '#calEmbed',
      calLink: `mycustomai/${config.calSlug}`,
      config: { layout: 'month_view' }
    });
    Cal('ui', { hideEventTypeDetails: false, layout: 'month_view' });
  </script>
</body>
</html>
