<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchase Confirmed — My Custom AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --accent: #3b82f6;
      --bg: #0b0f1e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --card-bg: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    .confirmation-wrap { max-width: 900px; margin: 0 auto; padding: 60px 24px; }
    .confirmation-header { text-align: center; margin-bottom: 48px; }
    .check-icon { font-size: 4rem; color: var(--primary); margin-bottom: 16px; }
    .confirmation-header h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin-bottom: 12px; }
    .confirmation-header p { font-size: 1.1rem; color: var(--muted); }
    
    .booking-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
    }
    .booking-card h2 { font-size: 1.5rem; margin-bottom: 16px; color: var(--primary); }
    .booking-card p { font-size: 1rem; line-height: 1.6; color: var(--muted); margin-bottom: 24px; }
    
    .cal-embed { min-width: 100%; height: 650px; }
    
    .help-section { text-align: center; padding: 32px; background: var(--card-bg); border-radius: 12px; }
    .help-section h3 { margin-bottom: 12px; }
    .help-section a { color: var(--primary); text-decoration: none; }
    .help-section a:hover { color: var(--primary-hover); }
  </style>
</head>
<body>
  <div class="confirmation-wrap">
    <div class="confirmation-header">
      <div class="check-icon">✓</div>
      <h1>Payment Confirmed!</h1>
      <p>Your purchase was successful. Now let's schedule your sessions.</p>
    </div>

    <div class="booking-card">
      <h2 id="tierTitle">Loading...</h2>
      <p id="tierInstructions"></p>
      <div class="cal-embed" id="calEmbed"></div>
    </div>

    <div class="help-section">
      <h3>Questions?</h3>
      <p>Email us at <a href="mailto:hello@mycustomai.co">hello@mycustomai.co</a> or <a href="audit.html">request a free audit</a>.</p>
    </div>
  </div>

  <script type="text/javascript" src="https://app.cal.com/embed/embed.js"></script>
  <script>
    // Parse tier from URL
    const params = new URLSearchParams(window.location.search);
    const tier = params.get('tier');
    
    // Keys are the ?tier= values sent by the existing Stripe redirect URLs and the
    // Cal.com slugs are live booking pages — both stay as-is. Only the displayed
    // tier numbering changed when the entry tier was removed:
    //   ?tier=2 → Tier 1 (Guided Sprint and Training)
    //   ?tier=3 → Tier 2 (Intensive Advisory)
    const tierConfig = {
      '2': {
        title: 'Tier 1 — Guided Sprint and Training',
        instructions: 'Your program runs 5 weeks. Book your first session below — you\'ll schedule the rest as we progress through your sprint.',
        calSlug: 'tier-2-setup-sprint'
      },
      '3': {
        title: 'Tier 2 — Intensive Advisory',
        instructions: 'Your program runs 8 weeks of intensive advisory sessions. Book your first session below — we\'ll coordinate the full schedule together as we go.',
        calSlug: 'tier-3-intensive-advisory'
      }
    };
    
    const config = tierConfig[tier] || tierConfig['2'];
    
    document.getElementById('tierTitle').textContent = config.title;
    document.getElementById('tierInstructions').textContent = config.instructions;
    
    // Embed Cal.com
    const embedDiv = document.getElementById('calEmbed');
    embedDiv.setAttribute('data-cal-link', `mycustomai/${config.calSlug}`);
    embedDiv.setAttribute('data-cal-config', JSON.stringify({layout: 'month_view'}));
    
    // Initialize Cal.com embed
    if (window.Cal) {
      window.Cal('init');
    }
  </script>
</body>
</html>
